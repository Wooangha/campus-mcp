[package]
name = "campus-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
hex = "0.4"
openssl = "0.10"
p256 = { version = "0.13", features = ["arithmetic"] }
regex = "1"
reqwest = { version = "0.12", features = ["cookies", "rustls-tls"] }
scraper = "0.27.0"
thiserror = "2"
tempfile = "3"
rmcp = { version = "=3.5.0", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-std"] }
url = "2"

[dev-dependencies]
rmcp = { version = "=3.5.0", features = ["client"] }
